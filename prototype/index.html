<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어디까지 했어? 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* 하얀 작업실 + 파스텔 메모: 바이올렛 하나가 행동을 이끌고, 진행은 파스텔 상태 칩 보드로. 알약 버튼, 24px 카드. */
:root{
  --canvas:#F5F6F8; --card:#FFFFFF; --ink:#333333; --slate:#535768; --iron:#808080;
  --mist:#D0D4E4; --pebble:#DDDFEB; --dust:#E6E7EA;
  --violet:#6161FF; --violet-ink:#4B4BD9; --violet-wash:#DBDBFF; --periwinkle:#E7ECFF; --lavender:#EDDFF7;
  --mint:#BCFE90; --sky:#ABF0FF; --aqua:#D1FAFF; --peach:#FFE1CC; --peach-ink:#8A4210;
  --late-bg:#FFDCE1; --late:#B3243B;
  --shadow:0 2px 48px 0 rgba(205,208,223,.4);
  --shadow-up:0 5px 45px 0 rgba(0,0,0,.15);
  --f:'Poppins','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  /* 호환 */
  --paper:var(--canvas); --sheet:var(--card); --sub:var(--slate); --line:var(--mist); --tint:var(--periwinkle); --accent:var(--violet); --fog:var(--iron); --dash:var(--mist); --sticker:var(--violet-wash); --ink2:var(--ink); --focus:var(--violet);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:#EBEDF3;color:var(--ink);font-family:var(--f);letter-spacing:-0.01em;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere}
body{min-height:100vh;display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;padding:32px 16px}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--violet-ink)}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

.phone{width:390px;height:844px;background:var(--canvas);border-radius:44px;position:relative;overflow:hidden;display:flex;flex-direction:column;flex:none;box-shadow:0 0 0 10px #1F2130, 0 30px 80px rgba(31,33,48,.35)}
@media (max-width:460px){body{padding:0;gap:0}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.guide{width:100%;border-radius:0;box-shadow:none}}
.screen{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding-top:14px}
.scroll{flex:1 1 auto;overflow-y:auto;min-height:0;padding-bottom:24px}

/* 앱 머리 */
.top{display:flex;align-items:center;gap:4px;padding:10px 12px 10px 8px}
.top .ttl{flex:1 1 auto;min-width:0}
.top h1{margin:0;font-weight:600;font-size:18px;line-height:1.4;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;line-height:1.45;color:var(--slate)}
.iconbtn{width:44px;height:44px;border:none;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex:none;color:var(--ink);box-shadow:0 1px 3px rgba(51,51,51,.08)}
.badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--violet);color:#fff;font:600 11px/18px var(--f);text-align:center;box-shadow:0 0 0 2px var(--canvas)}
.logo{width:28px;height:28px;border-radius:9px;background:conic-gradient(from 270deg,#8181FF 15%,#33DBDB 40%,#33D58E 55%,#FFD633 65%,#FC527D 85%,#8181FF 100%);flex:none;position:relative}
.logo::after{content:"";position:absolute;inset:7px;border-radius:4px;background:#fff}

/* 큰 제목 */
.big{padding:20px 24px 8px}
.big h1{margin:0;font-weight:300;font-size:30px;line-height:1.25;letter-spacing:-0.03em;text-wrap:balance}
.big h1 b{font-weight:600}
.big p{margin:10px 0 0;font-size:15px;line-height:1.55;color:var(--slate)}

/* 카드 */
.sheet{background:var(--card);border-radius:24px;margin:16px 16px 0;overflow:hidden;box-shadow:var(--shadow)}
.sheet .pad{padding:20px}
.sheet-h{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 4px}
.sheet-h h2{margin:0;font-weight:600;font-size:16px;line-height:1.5}
.sheet-h span{font-size:13px;color:var(--slate)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:28px 24px 0}
.sec-h h2{margin:0;font-weight:600;font-size:17px}
.sec-h span{font-size:13px;color:var(--slate)}
.hint{font-size:13px;line-height:1.5;color:var(--slate);margin:8px 0 0}
.err{font-size:14px;line-height:1.5;color:var(--late);margin:8px 0 0;font-weight:500}

/* 줄 */
.line{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;border:none;background:transparent;text-align:left;border-top:1px solid #EEF0F5}
.sheet .line:first-child{border-top:none}
button.line:active{background:#FAFAFC}
.line .grow{flex:1 1 auto;min-width:0}
.line .t{font-weight:500;font-size:16px;line-height:1.45}
.line .s{font-size:13px;line-height:1.5;color:var(--slate);margin-top:2px}
.chev{flex:none;color:#A9ACBC}

/* 아바타 */
.av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:600 14px/1 var(--f);color:var(--ink);background:var(--c, var(--periwinkle))}
.av.sm{width:28px;height:28px;font-size:12px}
.stack{display:flex}
.stack .av{width:28px;height:28px;font-size:11px;border:2px solid #fff;margin-left:-8px}
.stack .av:first-child{margin-left:0}
.me{display:inline-block;margin-left:6px;padding:0 7px;border-radius:6px;background:var(--violet-wash);color:var(--violet-ink);font:600 11px/18px var(--f);vertical-align:1px}

/* 보드: 상태 칩 */
.board-h,.brow{display:grid;align-items:center;column-gap:6px}
.board-h{padding:18px 16px 10px;font-size:12px;color:var(--slate)}
.board-h b{display:block;color:var(--ink);font-size:13px;font-weight:600}
.board-h .bh{text-align:center}
.brow{width:100%;padding:10px 16px;border:none;background:transparent;text-align:left;border-top:1px solid #EEF0F5}
.brow:active{background:#FAFAFC}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-size:15px;font-weight:500}
.who small{display:block;font-size:12px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .nm{min-width:0}
.slot{display:block}
.sd{display:none}
.stamp{height:40px;width:100%;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:500;line-height:1.2}
.stamp small{font-size:10px;font-weight:400;opacity:.8}
.stamp.done{background:var(--mint);color:#1F3A0E}
.stamp.todo{background:var(--canvas);color:var(--slate)}
.stamp.next{background:var(--violet);color:#fff;font-weight:600}
.stamp.ext{background:var(--peach);color:var(--peach-ink)}
.stamp.late{background:var(--late-bg);color:var(--late);font-weight:600}
.stk{display:none}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 18px;border-top:1px solid #EEF0F5}
.legend span{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500}
.legend i{display:none}
.lg-done{background:var(--mint);color:#1F3A0E}.lg-todo{background:var(--canvas);color:var(--slate)}.lg-late{background:var(--late-bg);color:var(--late)}.lg-ext{background:var(--peach);color:var(--peach-ink)}.lg-next{background:var(--violet);color:#fff}

/* 팀 머리 */
.hero{margin:8px 16px 0;padding:22px 22px 20px;border-radius:24px;background:var(--violet);color:#fff;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 32px rgba(97,97,255,.28)}
.hero .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.dday{font-weight:300;font-size:44px;line-height:1;letter-spacing:-0.04em}
.hero p{margin:0;font-size:13px;line-height:1.5;color:#E9E9FF}
.hero p b{color:#fff;font-weight:600;font-size:14px}
.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.28);overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:#fff}
.hero .stack .av{border-color:var(--violet)}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:16px 16px 0}

/* 띠 */
.ribbon{display:flex;align-items:center;gap:12px;margin:12px 16px 0;padding:14px 16px;border-radius:16px;background:var(--card);border:none;width:calc(100% - 32px);text-align:left;box-shadow:var(--shadow)}
.ribbon .grow{flex:1 1 auto;font-size:14px;line-height:1.5}

/* 버튼 */
.bar{display:flex;gap:8px;padding:12px 16px 24px;background:linear-gradient(rgba(245,246,248,0),var(--canvas) 30%)}
.btn{min-height:52px;border-radius:160px;border:1px solid var(--slate);background:var(--card);color:var(--ink);font-size:16px;font-weight:500;padding:0 22px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--violet);color:#fff;border-color:var(--violet);font-weight:600;box-shadow:0 8px 20px rgba(97,97,255,.3)}
.btn.grow{flex:1 1 0}.btn.grow2{flex:2 1 0}
.btn.small{min-height:44px;font-size:14px;padding:0 16px;border-color:var(--pebble)}
.btn.small.primary{border-color:var(--violet);box-shadow:none}
.btn.text{border:none;background:transparent;color:var(--violet-ink);font-weight:500;padding:0 4px;min-height:44px}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.btn:active:not([disabled]){transform:scale(.98)}

/* 입력 */
.label{display:block;font-size:14px;font-weight:500;margin:0 0 8px}
.field{width:100%;height:52px;border:1px solid var(--pebble);border-radius:6px;background:var(--card);padding:0 14px;font-size:16px}
.field::placeholder{color:#9A9DAE}
textarea.field{height:92px;padding:12px 14px;resize:none;line-height:1.5}
.field:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-wash)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;border:1px solid var(--pebble);border-radius:160px;background:var(--card);padding:0 16px;font-size:14px;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-wash);color:var(--violet-ink);font-weight:600}
.chip[aria-pressed="true"] .hint{color:var(--violet-ink)}
.chip[disabled]{opacity:.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid2 .chip{border-radius:16px}
.pick{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;border:1.5px dashed var(--mist);border-radius:16px;background:var(--canvas);padding:0 16px;text-align:left;color:var(--ink)}
.pick.has{border:none;background:var(--periwinkle)}

/* 알림 */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin:8px 16px 0;padding:4px;border-radius:160px;background:var(--card);box-shadow:var(--shadow)}
.seg button{height:40px;border:none;border-radius:160px;background:transparent;font-size:14px;color:var(--slate);font-weight:500}
.seg button[aria-selected="true"]{background:var(--violet);color:#fff;font-weight:600}
.alert{display:flex;gap:14px;padding:18px 20px;border-top:1px solid #EEF0F5}
.sheet .alert:first-child{border-top:none}
.alert .ic{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font:600 13px/1 var(--f)}
.ic.late{background:var(--late-bg);color:var(--late)}
.ic.ext{background:var(--peach);color:var(--peach-ink)}
.ic.help{background:var(--sky);color:#0D4A5A}
.ic.ack{background:var(--mint);color:#1F3A0E}
.ic.me{background:var(--violet);color:#fff;white-space:nowrap}
.alert .body{flex:1 1 auto;min-width:0}
.alert p{margin:0 0 4px;font-size:15px;line-height:1.55}
.alert .when{font-size:12px;color:var(--slate)}
.alert .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* 상세 */
.stage{padding:18px 20px;border-top:1px solid #EEF0F5}
.sheet .stage:first-child{border-top:none}
.stage .hd{display:flex;align-items:center;gap:12px}
.stage .hd .slot{order:2;margin-left:auto}
.stage .hd .stamp{width:auto;height:28px;padding:0 10px;flex-direction:row;gap:4px}
.stage .nm{font-weight:600;font-size:16px}
.stage .st{font-size:13px;color:var(--slate)}
.file{display:flex;align-items:center;gap:12px;margin-top:14px;padding:0 16px;min-height:56px;border:none;border-radius:16px;background:var(--canvas);width:100%;text-align:left;font-size:15px;color:var(--ink)}
.file svg{color:var(--violet)}
.memo{margin:12px 0 0;font-size:14px;line-height:1.55;color:var(--slate)}
.checks{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:13px;color:var(--slate)}
.checks span{flex:1 1 auto}

/* 빈·오류 */
.empty{margin:16px 16px 0;padding:28px 24px;border-radius:24px;background:var(--lavender);text-align:left}
.empty h2{font-weight:600;font-size:19px;margin:18px 0 8px}
.empty p{margin:0;font-size:15px;line-height:1.55;color:#4A4458}
.ghost-row{display:flex;gap:6px}
.ghost-row i{width:44px;height:28px;border-radius:6px;background:rgba(255,255,255,.7)}
.ghost-row i:first-child{background:var(--violet)}
.errbox{margin:16px 16px 0;padding:28px 24px;border-radius:24px;background:var(--card);box-shadow:var(--shadow)}
.errbox h2{font-weight:600;font-size:20px;margin:0 0 8px}
.errbox p{margin:0;font-size:15px;line-height:1.55;color:var(--slate)}
.errmark{width:52px;height:52px;border-radius:16px;background:var(--late-bg);color:var(--late);display:flex;align-items:center;justify-content:center;font:600 22px/1 var(--f);margin-bottom:18px}

/* 토스트 */
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#1F2130;color:#fff;padding:14px 18px;font-size:14px;line-height:1.5;border-radius:16px;box-shadow:var(--shadow-up);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:5}
.toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.btn:active:not([disabled]){transform:none}}

.doc{margin:16px 16px 0;border-radius:24px;background:#fff;box-shadow:var(--shadow);padding:28px 24px;min-height:400px}
.doc .lnx{height:10px;border-radius:5px;background:var(--canvas);margin:14px 0}
.doc .lnx.s{width:62%}
.kakao{border-radius:16px;background:var(--canvas);padding:14px 16px;font-size:14px;line-height:1.55}

.guide{width:320px;background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:28px;font-size:14px;line-height:1.55;flex:none}
.guide h2{font-weight:600;font-size:20px;margin:0 0 8px}
.guide .now{background:var(--violet-wash);color:var(--violet-ink);padding:1px 6px;border-radius:6px}
.guide ol{padding-left:20px;margin:12px 0}
.guide li{margin:4px 0}
.guide li.cur{font-weight:600}
.guide li.done{color:#9A9DAE;text-decoration:line-through}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="phone" id="phone" aria-live="polite">
  <div class="screen" id="app"></div>
  <div class="toast" id="toast" role="status"></div>
</div>
<aside class="guide" id="guide" aria-label="시나리오 안내"></aside>

<script>
(function(){
'use strict';
/* ───────── 날짜 도우미 (기준: 2026-11-15 일요일) ───────── */
var TODAY = new Date(2026, 10, 15);
var DOW = ['일','월','화','수','목','금','토'];
function md(d){ return (d.getMonth()+1) + '/' + d.getDate(); }
function mdw(d){ return md(d) + ' (' + DOW[d.getDay()] + ')'; }
function D(m, d){ return new Date(2026, m-1, d); }
function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
function dday(d){ var n = Math.round((d - TODAY)/86400000); return n === 0 ? 'D-DAY' : (n > 0 ? 'D-' + n : 'D+' + (-n)); }
function iso(d){ var m = d.getMonth()+1, dd = d.getDate(); return d.getFullYear() + '-' + (m<10?'0':'') + m + '-' + (dd<10?'0':'') + dd; }
function fromIso(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ───────── 더미 데이터 ───────── */
function seed(){
  var mkt = {
    id:'mkt', name:'마케팅원론 기획서', due:D(11,20), size:4, isNew:false,
    stages:[{label:'자료조사', due:D(11,12)}, {label:'초안', due:D(11,16)}, {label:'완성', due:D(11,19)}],
    members:[
      {name:'김민수', part:'시장조사, 취합', cells:[
        {s:'done', at:D(11,10), file:'시장조사_자료모음.xlsx', memo:'경쟁사 3곳 가격·채널 정리. 출처는 2번째 시트에.', checks:['이수아','정예린']},
        {s:'done', at:D(11,14), file:'시장조사_초안.docx', memo:'목차 2장까지 썼어요. 4P랑 이어지는 부분 표시해 둠.', checks:['정예린']},
        {s:'todo'}]},
      {name:'이수아', part:'4P 분석', cells:[
        {s:'done', at:D(11,11), file:'4P_자료모음.pdf', memo:'가격 부분 출처는 표 2쪽에 정리했어요.', checks:['김민수','정예린']},
        {s:'todo'}, {s:'todo'}]},
      {name:'한도윤', part:'발표자료', cells:[
        {s:'done', at:D(11,12), link:'https://docs.google.com/presentation/…', memo:'참고 슬라이드 링크만 모아 뒀어요.', checks:['이수아']},
        {s:'todo'}, {s:'todo'}]},
      {name:'정예린', part:'SWOT 분석', cells:[
        {s:'late'}, {s:'todo'}, {s:'todo'}]}
    ]
  };
  mkt.final = {file:'마케팅원론_기획서_최종본_v1.pdf', by:'김민수', at:'11/15 21:40', memo:'4P와 SWOT 자리는 비워 두고 합쳤어요. 빈 곳은 노란색으로 표시했어요.', checks:['이수아']};
  var cap = {
    id:'cap', name:'캡스톤디자인 시스템 개발', due:D(12,4), size:4, isNew:false,
    stages:[{label:'설계', due:D(11,13)}, {label:'구현', due:D(11,27)}, {label:'테스트', due:D(12,2)}],
    members:[
      {name:'김민수', part:'서버', cells:[{s:'done', at:D(11,12), file:'설계서_v1.pdf', memo:'ERD 포함', checks:['박서준']}, {s:'todo'}, {s:'todo'}]},
      {name:'박서준', part:'앱 화면', cells:[{s:'done', at:D(11,13), file:'화면설계.fig 링크', memo:'', checks:[]}, {s:'todo'}, {s:'todo'}]},
      {name:'최하은', part:'데이터', cells:[{s:'done', at:D(11,13), memo:'더미 데이터 200건 준비 완료', checks:[]}, {s:'todo'}, {s:'todo'}]},
      {name:'윤지민', part:'문서·발표', cells:[{s:'ext', due:D(11,16), reason:'다른 과제 마감'}, {s:'todo'}, {s:'todo'}]}
    ]
  };
  var gy = {
    id:'gy', name:'교양 조별 발표', due:D(11,27), size:4, isNew:true,

function team(id){ for (var i=0;i<S.teams.length;i++) if (S.teams[i].id===id) return S.teams[i]; return null; }
function myTeams(){ return S.teams.filter(function(t){ return t.members.some(function(m){ return m.name===S.me; }); }); }
function meIn(t){ for (var i=0;i<t.members.length;i++) if (t.members[i].name===S.me) return t.members[i]; return null; }
function cellDue(t, m, i){ var c = m.cells[i]; return c.s==='ext' ? c.due : t.stages[i].due; }
function isLate(t, m, i){ var c = m.cells[i]; return c.s==='late' || ((c.s==='todo'||c.s==='ext') && cellDue(t,m,i) < TODAY); }
function nextIdx(m){ for (var i=0;i<m.cells.length;i++) if (m.cells[i].s!=='done') return i; return -1; }
function doneCount(t){ var n=0; t.members.forEach(function(m){ m.cells.forEach(function(c){ if(c.s==='done') n++; }); }); return n; }
function lateCount(t){ var n=0; t.members.forEach(function(m){ m.cells.forEach(function(c,i){ if(isLate(t,m,i)) n++; }); }); return n; }

}

}

function stamp(t, m, i, col, isMe){

function teamStats(t, mm, mi){

    sc.steps.forEach(function(st, k){ h += '<li class="' + (k < S.step ? 'done' : k === S.step ? 'cur' : '') + '">' + (k === S.step ? '<span class="now">' + esc(st[1]) + '</span>' : esc(st[1])) + '</li>'; });
    h += '</ol>';
    if (S.flags.finished) h += '<p style="margin:8px 0;font-weight:600">시나리오 끝! 다른 시나리오도 따라가 보세요.</p>';
    h += '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" data-a="replay">처음부터 다시</button><button class="btn small" data-a="restart">시나리오 선택으로</button></div>';
  }
  g.innerHTML = h;
}
function advance(stepKey){ // 행동 기반 단계 진행
  var sc = S.scen; if (!sc) return;
  for (var k=0;k<sc.steps.length;k++) if (sc.steps[k][0]===stepKey && k >= S.step) { S.step = k; break; }
}
function finish(){ if (S.scen){ S.step = S.scen.steps.length; S.flags.finished = true; } }

/* ───────── 이벤트 ───────── */
function startScen(sc){
  reset(sc);
  var st = sc.start, home = {name:'home', p:{}};
  S.cur = null; S.stack = [];
  if (sc.id==='C'){ S.stack = [home, {name:'team', p:{team:'mkt'}}]; S.cur = {name:'alerts', p:{team:'mkt', tab:'mine'}}; render(); return; }
  if (sc.id==='B'){ S.stack = []; S.cur = {name:'join', p:{}}; render(); return; }
  if (sc.id==='E'){ S.stack = []; S.cur = {name:'errlink', p:{}}; render(); return; }
  S.cur = {name:st[0], p:st[1]||{}}; render();
}
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  var a = b.getAttribute('data-a'), d = b.dataset;
  var t = d.team ? team(d.team) : null;
  switch(a){
    case 'scen': startScen(SCEN.filter(function(s){ return s.id===d.id; })[0]); break;
    case 'free': reset(null); S.cur = {name:'start', p:{}}; go('home'); break;
    case 'restart': reset(null); S.stack = []; S.cur = {name:'start', p:{}}; render(); break;
    case 'replay': startScen(S.scen); break;
    case 'back': back(); break;
    case 'tohome': resetTo([['home']]); if (S.scen && S.scen.id==='E') advance('home'); renderGuide(); break;
    case 'openteam': go('team', {team:d.id}); break;
    case 'create': S.flags.create = null; go('create'); break;
    case 'ctype': S.flags.create.type = d.v; S.flags.create.name = document.getElementById('c-name').value; S.flags.create.due = document.getElementById('c-due').value; render(); break;
    case 'docreate': {
      var name = document.getElementById('c-name').value.trim(), due = document.getElementById('c-due').value;
      if (!name){ document.getElementById('c-err').hidden = false; document.getElementById('c-name').focus(); return; }
      var dueD = due ? fromIso(due) : addDays(TODAY, 14);
      if (dueD <= TODAY) dueD = addDays(TODAY, 7);
      var tpl = {'발표':['자료조사','초안','완성'], '보고서':['목차','초안','완성'], '개발':['설계','구현','테스트'], '직접 정하기':['1단계']}[S.flags.create.type];
      var span = Math.round((dueD - TODAY)/86400000), stages = tpl.map(function(lb, i){ var off = Math.max(1, Math.round(span * (i+1) / (tpl.length+0.5))); var dd = addDays(TODAY, off); if (dd >= dueD) dd = addDays(dueD, -1); return {label:lb, due:dd}; });
      var nt = {id:'new' + Date.now().toString(36).slice(-4), name:name, due:dueD, size:4, isNew:true, stages:stages, members:[{name:S.me, part:'기획 총괄', cells:stages.map(function(){ return {s:'todo'}; })}]};
      S.teams.unshift(nt); S.teamAlerts[nt.id] = [];
      go('share', {team:nt.id}); break; }
    case 'kakao': toast(d.msg); if (S.scen && S.scen.id==='D') advance('alerts2'); renderGuide(); break;
    case 'copy': toast('팀 링크를 복사했어요'); break;
    case 'tostages': go('stages', {team:d.team}); break;
    case 'sdate': break;
    case 'sdel': { t = team(S.cur.p.team); collectStages(t); t.stages.splice(+d.i, 1); t.members.forEach(function(m){ m.cells.splice(+d.i, 1); }); render(); break; }
    case 'sadd': { t = team(S.cur.p.team); collectStages(t); var last = t.stages[t.stages.length-1].due; var nd = addDays(last, 1); if (nd >= t.due) nd = addDays(t.due, -1); t.stages.push({label:'검토', due:nd}); t.members.forEach(function(m){ m.cells.push({s:'todo'}); }); render(); break; }
    case 'editstages': go('stages', {team:d.team, edit:true}); break;
    case 'files': go('files', {team:d.team}); break;
    case 'contrib': go('contrib', {team:d.team}); break;
    case 'cchart': go('cchart', {team:d.team, view:'chart'}); break;
    case 'cview': S.cur.p.view = d.v; render(); break;
    case 'fpreview': go('fpreview', {team:d.team}); break;
    case 'finalcheck': { var tf = team(d.team); if (tf.final.checks.indexOf(S.me) < 0) tf.final.checks.push(S.me); render(); toast(tf.final.by + '님에게 최종본 확인이 보여요'); break; }
    case 'contribexport': toast('팀원별 기록을 표로 정리했어요. 시연이라 파일은 안 만들어요.'); if (S.scen && S.scen.id==='F') { finish(); renderGuide(); } break;
    case 'savestages': {
      t = team(d.team); var before = t.stages.map(function(x){ return x.label + md(x.due); }).join();
      if (!collectStages(t)) return;
      var part2 = document.getElementById('mypart').value.trim(); if (part2) meIn(t).part = part2;
      var changed = before !== t.stages.map(function(x){ return x.label + md(x.due); }).join();
      if (changed) (S.teamAlerts[t.id] = S.teamAlerts[t.id] || []).unshift({k:'ext', text:S.me + '님이 단계 기한을 고쳤어요. ' + t.stages.map(function(x){ return x.label + ' ~' + md(x.due); }).join(', '), when:'방금'});
      back(); toast(changed ? '저장했어요. 바뀐 기한을 팀에 알렸어요.' : '저장했어요.'); break; }
    case 'startteam': {
      t = team(d.team); if (!collectStages(t)) return;
      var part = document.getElementById('mypart').value.trim(); if (part) meIn(t).part = part;
      resetTo([['home'], ['team', {team:t.id}]]); toast('팀을 시작했어요. 팀원이 들어오면 여기에 보여요.'); break; }
    case 'dojoin': {
      var nm = document.getElementById('j-name').value.trim();
      if (!nm){ document.getElementById('j-err').hidden = false; return; }
      if (nm !== '이수아'){ var mk = team('mkt'), mm = meIn({members:mk.members.filter(function(x){return x.name===nm;})}); if (!mm){ S.me = nm; mk.members.push({name:nm, part:'파트 미정', cells:mk.stages.map(function(){ return {s:'todo'}; })}); } else S.me = nm; }
      resetTo([['home'], ['team', {team:'mkt'}]]); toast('들어왔어요! 이 기기에서는 다음부터 바로 열려요.'); break; }
    case 'detail': go('detail', {team:d.team, m:+d.m}); break;
    case 'preview': go('preview', {team:d.team, m:+d.m, i:+d.i}); break;
    case 'check': { var c = t.members[+d.m].cells[+d.i]; if (c.checks.indexOf(S.me) < 0) c.checks.push(S.me); render(); toast(t.members[+d.m].name + '님에게 ‘확인했어요’가 보여요'); break; }
    case 'alerts': go('alerts', {team:d.team, tab:'team'}); break;
    case 'tab': S.cur.p.tab = d.v; render(); break;
    case 'sharestatus': { var tt = team(d.team); toast('단톡방에 오늘 현황을 보냈어요. ' + doneCount(tt) + '칸 올림' + (lateCount(tt) ? ', 기한 지남 ' + lateCount(tt) + '칸' : '') + ' (시연)'); break; }
    case 'reshare': go('share', {team:d.team, again:true}); break;
    case 'upload': S.flags.upload = null; go('upload', {team:d.team, i: d.i != null ? +d.i : null}); break;
    case 'ustage': saveUpload(); S.flags.upload.stage = +d.i; render(); break;
    case 'pickfile': {
      saveUpload(); var f = S.flags.upload, tm = team(S.cur.p.team);
      var big = S.scen && S.scen.id==='E';
      var names = {'이수아':'4P_분석_초안.docx', '한도윤':'발표자료_초안.pptx', '김민수':'시장조사_최종.docx'};
      f.file = big ? '발표자료_최종_영상포함.pptx (82MB)' : (names[S.me] || '결과물.pdf') ; f.big = big;
      if (S.scen && S.scen.id==='B') { if (!f.memo) f.memo = '4P 중 가격·유통까지 썼어요. 촉진은 내일 보강할게요.'; }
      render(); break; }
    case 'doupload': {
      saveUpload(); var f2 = S.flags.upload, tm2 = team(d.team), me = meIn(tm2);
      if (!f2.file && !f2.link && !f2.memo){ document.getElementById('u-err').hidden = false; return; }
      if (f2.file && f2.big){ go('errupload', {team:d.team}); if (S.scen) advance('errupload'); renderGuide(); return; }
      var cc = me.cells[f2.stage];
      me.cells[f2.stage] = {s:'done', at:TODAY, file:f2.file || '', link:f2.link || '', memo:f2.memo || '', checks:[]};
      // 내 알림 정리
      if (S.mine[tm2.id]) S.mine[tm2.id] = S.mine[tm2.id].filter(function(x){ return x.stage !== f2.stage; });
      var label = tm2.stages[f2.stage].label;
      S.flags.upload = null;
      resetTo([['home'], ['team', {team:tm2.id}]]);
      toast('‘' + label + '’ 칸에 올렸어요. 팀 화면에 바로 보여요.');
      if (S.scen && (S.scen.id==='B' || S.scen.id==='E')) finish(); renderGuide();
      break; }
    case 'retry': S.flags.upload.file = ''; S.flags.upload.big = false; back(); break;
    case 'linkmode': S.flags.upload.file = ''; S.flags.upload.big = false; S.flags.upload.link = 'https://drive.google.com/file/d/발표자료_최종'; S.flags.upload.focusLink = true; back(); toast('링크를 넣어 두었어요. 확인하고 올려 주세요.'); break;
    case 'extend': S.flags.extend = null; go('extend', {team:d.team}); break;
    case 'edays': saveExtend(); S.flags.extend.days = +d.v; render(); break;
    case 'ereason': saveExtend(); S.flags.extend.reason = d.v; render(); break;
    case 'doextend': {
      saveExtend(); var fx = S.flags.extend, tx = team(d.team), mx = meIn(tx), ix = nextIdx(mx);
      if (!fx.reason){ document.getElementById('e-err').hidden = false; return; }
      var basex = cellDue(tx,mx,ix), ndx = addDays(basex, fx.days), help = fx.reason==='막혔어요, 도움 필요' || ndx > tx.due;
      var lab = tx.stages[ix].label;
      if (help){
        S.teamAlerts[tx.id].unshift({k:'help', text:S.me + '님이 ‘' + lab + '’ 칸에서 도움을 요청했어요.' + (fx.memo ? ' “' + fx.memo + '”' : ''), when:'방금'});
        toast('팀에 도움 요청을 알렸어요');
      } else {
        mx.cells[ix] = {s:'ext', due:ndx, reason:fx.reason};
        S.teamAlerts[tx.id].unshift({k:'ext', text:S.me + '님이 ‘' + lab + '’ 칸을 ' + fx.days + '일 연장했어요. 새 기한은 ' + md(ndx) + '이에요.' + (fx.memo ? ' “' + fx.memo + '”' : ''), reason:fx.reason, when:'방금'});
        toast('‘' + lab + '’ 기한을 ' + md(ndx) + '로 바꾸고 팀에 알렸어요');
      }
      if (S.mine[tx.id]) S.mine[tx.id] = S.mine[tx.id].filter(function(x){ return x.stage !== ix; });
      S.flags.extend = null;
      resetTo([['home'], ['team', {team:tx.id}]]);
      if (S.scen && S.scen.id==='C') advance('team'); renderGuide();
      break; }
  }
});
function ccTip(e){
  var g = e.target.closest && e.target.closest('[data-tip]'), tip = document.getElementById('cc-tip'); if (!tip) return;
  if (!g){ tip.style.opacity = 0; return; }
  var wrap = document.getElementById('cc-wrap').getBoundingClientRect(), r = g.getBoundingClientRect();
  tip.textContent = g.getAttribute('data-tip'); tip.style.opacity = 1;
  var left = Math.min(Math.max(r.left - wrap.left + 40, 0), wrap.width - tip.offsetWidth);
  tip.style.left = left + 'px'; tip.style.top = (r.top - wrap.top - 30) + 'px';
}
document.addEventListener('mouseover', ccTip);
document.addEventListener('focusin', ccTip);
document.addEventListener('touchstart', ccTip, {passive:true});
document.addEventListener('change', function(e){
  if (e.target.matches('[data-a="sdate"]') && S.cur.name==='stages') collectStages(team(S.cur.p.team));
});
function collectStages(t){
  var ok = true, prev = new Date(2000, 0, 1), err = document.getElementById('s-err');
  t.stages.forEach(function(s, i){
    var el = document.getElementById('sd' + i); if (!el || !el.value) return;
    var dd = fromIso(el.value);
    if (dd <= prev || dd > t.due){ ok = false; } else { s.due = dd; prev = dd; }
  });
  if (err){ err.hidden = ok; err.textContent = '기한은 앞 단계보다 늦고 팀 마감(' + md(t.due) + ')보다 빨라야 해요.'; }
  return ok;
}
function saveUpload(){ var f = S.flags.upload; if (!f) return; var l = document.getElementById('u-link'), m = document.getElementById('u-memo'); if (l) f.link = l.value.trim(); if (m) f.memo = m.value.trim(); }
function saveExtend(){ var f = S.flags.extend; if (!f) return; var m = document.getElementById('e-memo'); if (m) f.memo = m.value.trim(); }

// 시나리오 단계 키를 화면 이동에 맞춰 보정
var _go = go;
go = function(name, p, opt){
  _go(name, p, opt);
  var sc = S.scen; if (!sc) return;
  var map = {A:{create:'create', share:'share', stages:'stages', team:'team'},
             B:{team: S.step >= 2 ? 'team2' : 'team', detail:'detail', upload:'upload'},
             C:{extend:'extend'},
             D:{team:'team', alerts:'alerts', detail:'detail'},
             E:{home:'home', upload:'upload'},
             F:{team:'team', files:'files', contrib:'contrib', cchart:'cchart'}}[sc.id] || {};
  if (map[name]) advance(map[name]);
  if (sc.id==='C' && name==='alerts' && S.step >= 2) advance('alerts2'), finish();
  if (sc.id==='A' && name==='team' && team(p.team) && team(p.team).isNew) {}
  renderGuide();
};
var _back = back;
back = function(){
  _back();
  var sc = S.scen; if (!sc) return;
  if (sc.id==='A' && S.cur.name==='home' && S.step >= 4) finish();
  if (sc.id==='B' && S.cur.name==='team' && S.step >= 2) advance('team2');
  if (sc.id==='D' && S.cur.name==='alerts' && S.step >= 4) finish();
  if (sc.id==='D' && S.cur.name==='team' && S.step >= 4) finish();
  renderGuide();
};
// resetTo 이후 시나리오 A: 팀 시작 시 마지막 단계
var _resetTo = resetTo;
resetTo = function(list){ _resetTo(list); var sc = S.scen; if (sc && sc.id==='A' && S.cur.name==='team') advance('team'); renderGuide(); };

reset(null); S.cur = {name:'start', p:{}}; render();
})();
</script>
